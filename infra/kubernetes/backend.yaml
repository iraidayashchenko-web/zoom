apiVersion: apps/v1
kind: Deployment
metadata: { name: novameet-backend }
spec:
  replicas: 3
  selector: { matchLabels: { app: novameet-backend } }
  template:
    metadata: { labels: { app: novameet-backend } }
    spec:
      containers:
        - name: backend
          image: ghcr.io/example/novameet-backend:latest
          ports: [{ containerPort: 4000 }]
          envFrom: [{ secretRef: { name: novameet-secrets } }]
          readinessProbe: { httpGet: { path: /api/v1/health, port: 4000 } }
---
apiVersion: v1
kind: Service
metadata: { name: novameet-backend }
spec: { selector: { app: novameet-backend }, ports: [{ port: 80, targetPort: 4000 }] }
