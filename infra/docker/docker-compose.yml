services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: novameet, POSTGRES_PASSWORD: novameet, POSTGRES_DB: novameet }
    ports: ["5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: novameet, MINIO_ROOT_PASSWORD: novameet-secret }
    ports: ["9000:9000", "9001:9001"]
  coturn:
    image: coturn/coturn:4.6
    command: ["-n", "--log-file=stdout", "--min-port=49160", "--max-port=49200", "--user=novameet:turn-secret", "--realm=novameet.local"]
    ports: ["3478:3478/udp", "3478:3478/tcp"]
volumes: { postgres: {} }
